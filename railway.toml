# Default for the single "website" Railway service (site + API + Telegram).
# In Railway: leave Root Directory empty (repo root). Variables stay on this service.
# If login fails with vars on website, see RAILWAY_LOGIN_FIX.md (do not use Root apps/web).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/combined/Dockerfile"
watchPatterns = ["apps/web/**", "apps/api/**", "apps/combined/**"]

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/api/live"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"