# Use this config ONLY when Railway Root Directory = apps/web (web-only; no FastAPI in image).
# For dashboard login: Root Directory EMPTY, Config file path = /railway.toml (repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = ""
restartPolicyType = "ON_FAILURE"