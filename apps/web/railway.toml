# NOT production login. Root Directory apps/web → web-only image only.
# Production: PRODUCTION_DEPLOY.md (empty root, /railway.toml, apps/combined/Dockerfile).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = ""
restartPolicyType = "ON_FAILURE"