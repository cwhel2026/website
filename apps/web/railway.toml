# If Root directory is still "apps/web", login will fail — clear it (repo root).
# See RAILWAY_LOGIN_FIX.md and repo-root railway.toml (combined image).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"