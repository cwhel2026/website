# Root directory may stay "apps/web". In Railway → Settings, set Config file path: /apps/web/railway.toml
# dockerfilePath is relative to the repository root (not apps/web). Never use apps/web/Dockerfile for login.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/combined/Dockerfile"
watchPatterns = ["apps/web/**", "apps/api/**", "apps/combined/**"]

[deploy]
startCommand = "/app/start.sh"
# No Railway deploy health gate — combined boot is faster; verify /health manually after deploy.
healthcheckPath = ""
restartPolicyType = "ON_FAILURE"