# Use this config ONLY when Railway Root Directory = apps/web (web-only; no FastAPI in image).
# For dashboard login: Root Directory EMPTY, Config file path = /railway.toml (repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
startCommand = "/app/start.sh"
# Optional fast gate: Next-only liveness (no FastAPI). Clear in UI to disable entirely.
healthcheckPath = "/api/live"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"