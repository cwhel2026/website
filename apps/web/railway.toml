# Root directory may stay "apps/web" — dockerfilePath is relative to the **repo root**.
# Combined image: site + FastAPI; start.sh runs both.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/web/**", "apps/api/**", "apps/combined/**"]

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"