# Web-only image (Next.js). Telegram and FastAPI will NOT run with this config.
#
# For one-service deploys (variables on "website"), use the repo-root railway.toml
# and Dockerfile apps/combined/Dockerfile — see RAILWAY_COMBINED.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"