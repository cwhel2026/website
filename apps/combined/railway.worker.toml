# Railway "worker" service: same image as the website, runs Celery worker + beat.
# Point the worker service at this file: Settings → Config-as-code → Railway config file
#   apps/combined/railway.worker.toml
# Without it Railway applies the root railway.toml and starts a second website instead.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/combined/Dockerfile"
watchPatterns = ["apps/api/**", "apps/combined/**"]

[deploy]
startCommand = "/app/worker.sh"
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
