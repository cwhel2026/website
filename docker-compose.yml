services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rmd
      POSTGRES_PASSWORD: rmd_dev_password
      POSTGRES_DB: revive_my_drive
    ports:
      - "5432:5432"
    volumes:
      - rmd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmd -d revive_my_drive"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://rmd:rmd_dev_password@db:5432/revive_my_drive
      SYNC_DATABASE_URL: postgresql://rmd:rmd_dev_password@db:5432/revive_my_drive
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  rmd_pgdata: