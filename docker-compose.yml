services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rmd
      POSTGRES_PASSWORD: rmd_dev_password
      POSTGRES_DB: revive_my_drive
    ports:
      - "5432:5432"
    volumes:
      - rmd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmd -d revive_my_drive"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  rmd_pgdata: