name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        working-directory: apps/api
        run: pytest -q

  api-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rmd
          POSTGRES_PASSWORD: rmd_ci_password
          POSTGRES_DB: revive_my_drive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmd -d revive_my_drive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rmd:rmd_ci_password@localhost:5432/revive_my_drive
      SYNC_DATABASE_URL: postgresql://rmd:rmd_ci_password@localhost:5432/revive_my_drive
      JWT_SECRET: ci-integration-test-secret-at-least-thirty-two-chars
      RUN_INTEGRATION_TESTS: "1"
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Integration smoke
        working-directory: apps/api
        run: pytest -q tests/test_smoke_integration.py

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  combined-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production combined image
        run: docker build -f apps/combined/Dockerfile -t rmd-combined:ci .
      - name: Verify image layout
        run: |
          docker run --rm rmd-combined:ci test -f /app/start.sh
          docker run --rm rmd-combined:ci test -f /app/server.js
          docker run --rm rmd-combined:ci test -f /api/app/main.py
          docker run --rm rmd-combined:ci sh -c 'grep -q "HOSTNAME=0.0.0.0" /app/start.sh'